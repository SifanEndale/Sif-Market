<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact Sif Store for questions about our clothing and accessories."
    />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Sif Store</h1>
      <p>We would love to hear from you!</p>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
    </nav>

    <main>
      <section>
        <h2>Contact Information</h2>
        <p>Have a question about our collections? Send us a message.</p>

        <p>
          Email:
          <a href="mailto:sifstore@example.com"> sifstore@example.com </a>
        </p>
      </section>

      <section>
        <h2>Send Us a Message</h2>

        <form>
          <label for="name">Full Name:</label>
          <input type="text" id="name" name="name" required />

          <br /><br />

          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required />

          <br /><br />

          <label for="phone">Phone Number:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
          />

          <br /><br />

          <label for="category">What are you interested in?</label>
          <select id="category" name="category">
            <option value="kids">Kids' Clothing</option>
            <option value="women">Women's Clothing</option>
            <option value="jewelry">Jewelry and Accessories</option>
          </select>

          <br /><br />

          <label for="message">Your Message:</label>
          <textarea id="message" name="message" rows="4"></textarea>

          <br /><br />

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Sif Store. All rights reserved.</p>
      <p><a href="mailto:sifstore@example.com">Email Us</a></p>
    </footer>
  </body>
</html>
